name: Build Mod

on:
  push:
    tags:
      - 'v*'
  pull_request:

jobs:
  build:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')
    
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
          fetch-depth: 0

    - name: Compile Mod
      uses: xxanqw/compilation@v3
      
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mod-artifacts
        path: ./build/libs
